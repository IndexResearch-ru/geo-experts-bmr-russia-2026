name: Reproduce complete BMR study
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  bmr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify all 110 answers, 74 people and 11 interfaces
        run: python3 reproduce.py
